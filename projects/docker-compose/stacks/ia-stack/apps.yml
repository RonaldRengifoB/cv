version: "3.2"
services:
  thelounge:
    image: lscr.io/linuxserver/thelounge:latest
    container_name: $LOUNGE_SERVICE_NAME
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: lounge
        target: /config
        volume:
          nocopy: true   
    networks:
      - ia_apps  
    ports:
      - 9000:9000
    restart: unless-stopped

networks:
  ia_apps:
    name: ia_apps
    ipam:
      driver: default
      config:
        - subnet: $IA_APPS_SUBNET
          gateway: $IA_APPS_GW

volumes:
  lounge:
    driver_opts:
      type: "nfs4"
      o: "addr=$NAS_ADDR,$NAS_MOUNT_PARAMS"
      device: "$NAS_PATH/lounge/"
