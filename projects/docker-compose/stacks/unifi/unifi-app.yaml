version: "3.2"
services:
  
  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: $UNIFI_SERVICE_NAME
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - MONGO_USER=$UNIFI_MONGO_USER
      - MONGO_PASS=$UNIFI_MONGO_PASS
      - MONGO_HOST=$UNIFI_MONGO_HOST
      - MONGO_PORT=$UNIFI_MONGO_PORT
      - MONGO_DBNAME=$UNIFI_MONGO_DBNAME
      - MEM_LIMIT=$UNIFI_MEM_LIMIT
      - MEM_STARTUP=$UNIFI_MEM_STARTUP
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: unifi-controller
        target: /config
        volume:
          nocopy: true        
#    labels:
#    - com.centurylinklabs.watchtower.monitor-only="true"
#    - traefik.enable=true 
#    - traefik.http.routers.$UNIFI_SERVICE_NAME.rule=Host(`$UNIFI_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$UNIFI_SERVICE_NAME.entrypoints=web
#    - traefik.http.routers.$UNIFI_SERVICE_NAME-https.rule=Host(`$UNIFI_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$UNIFI_SERVICE_NAME-https.entrypoints=webs
#    - traefik.http.routers.$UNIFI_SERVICE_NAME-https.tls=true
#    - traefik.http.routers.$UNIFI_SERVICE_NAME-https.service=$UNIFI_SERVICE_NAME
#    - traefik.http.routers.$UNIFI_SERVICE_NAME-https.tls.certresolver=letsencrypt
#    - traefik.http.services.$UNIFI_SERVICE_NAME.loadbalancer.server.port=8443
#    - traefik.http.services.$UNIFI_SERVICE_NAME.loadbalancer.server.scheme=https
    networks:
      - apps 
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 6789:6789 #Mobile throughput test
      - 1900:1900/udp #Required for Make controller discoverable on L2 network option
      - 8843:8843 #Unifi guest portal HTTPS redirect port
      - 8880:8880 #Unifi guest portal HTTP redirect port
      - 5514:5514/udp #syslog report
    restart: unless-stopped

#  mongo:
#    image: mongo:4.4.24
#    container_name: $MONGO_SERVICE_NAME
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: $MONGO_INITDB_ROOT_USERNAME
#      MONGO_INITDB_ROOT_PASSWORD: $MONGO_INITDB_ROOT_PASSWORD
#    volumes:
#      - /mnt/docker/ymls/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
#      - /etc/localtime:/etc/localtime:ro
#      - /etc/timezone:/etc/timezone:ro
#      - type: volume
#        source: mongo
#        target: /data/db
#        volume:
#          nocopy: true  
#    networks:
#      - apps 
#    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: $ME_MONGO_SERVICE_NAME
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: $MONGO_INITDB_ROOT_USERNAME
      ME_CONFIG_MONGODB_ADMINPASSWORD: $MONGO_INITDB_ROOT_PASSWORD
      ME_CONFIG_MONGODB_SERVER: $MONGO_SERVER
      ME_CONFIG_BASICAUTH_USERNAME: $ME_CONFIG_BASICAUTH_USERNAME
      ME_CONFIG_BASICAUTH_PASSWORD: $ME_CONFIG_BASICAUTH_PASSWORD
#    labels:
#    - traefik.enable=true 
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME.rule=Host(`$ME_MONGO_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME.entrypoints=web
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.rule=Host(`$ME_MONGO_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.entrypoints=webs
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.middlewares=$AUTHELIA_SERVICE_NAME@docker
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.tls=true
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.service=$ME_MONGO_SERVICE_NAME
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.tls.certresolver=$CERTRESOLVER
#    - traefik.http.services.$ME_MONGO_SERVICE_NAME.loadbalancer.server.port=8081
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
    networks:
      - apps 
    ports:
      - 8081:8081
    restart: unless-stopped

networks:
  apps:
    name: apps
    ipam:
      driver: default
      config:
        - subnet: $APPS_SUBNET
          gateway: $APPS_GW

volumes:
  unifi-controller:
    driver_opts:
      type: "nfs4"
      o: "addr=$NAS_ADDR,$NAS_MOUNT_PARAMS"
      device: "$NAS_PATH/unifi-controller"

