#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.middlewares=$AUTHELIA_SERVICE_NAME@docker
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.tls=true
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.service=$ME_MONGO_SERVICE_NAME
#    - traefik.http.routers.$ME_MONGO_SERVICE_NAME-https.tls.certresolver=$CERTRESOLVER
#    - traefik.http.services.$ME_MONGO_SERVICE_NAME.loadbalancer.server.port=8081
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
    networks:
      - dbapps 
    ports:
      - 8081:8081
    restart: unless-stopped

  phpmyadmin:
    image: lscr.io/linuxserver/phpmyadmin:latest
    container_name: $PMA_SERVICE_NAME
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - PMA_ARBITRARY=1
#Container access controlled by traefik file 
#    labels:
#    - traefik.enable=true 
#    - traefik.http.routers.$PMA_SERVICE_NAME.rule=Host(`$PMA_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$PMA_SERVICE_NAME.entrypoints=web
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.rule=Host(`$PMA_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.entrypoints=webs
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.middlewares=$AUTHELIA_SERVICE_NAME@docker
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.tls=true
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.service=$PMA_SERVICE_NAME
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.tls.certresolver=$CERTRESOLVER
#    - traefik.http.services.$PMA_SERVICE_NAME.loadbalancer.server.port=8978
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: phpmyadmin
        target: /config
        volume:
          nocopy: true  
    networks:
      - dbapps
    ports: 
    - 8881:80
    restart: unless-stopped  

  phppgadmin:
    image: dpage/pgadmin4:latest
    container_name: $PGA_SERVICE_NAME
    environment:
    - PGADMIN_DEFAULT_EMAIL=$PGA_DEFAULT_EMAIL
    - PGADMIN_DEFAULT_PASSWORD=$PGA_DEFAULT_PASSWORD
#Container access controlled by traefik file 
#    labels:
#    - traefik.enable=true 
#    - traefik.http.routers.$PMA_SERVICE_NAME.rule=Host(`$PMA_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$PMA_SERVICE_NAME.entrypoints=web
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.rule=Host(`$PMA_ADDR_NAME.$DOMAIN`)
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.entrypoints=webs
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.middlewares=$AUTHELIA_SERVICE_NAME@docker
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.tls=true
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.service=$PMA_SERVICE_NAME
#    - traefik.http.routers.$PMA_SERVICE_NAME-https.tls.certresolver=$CERTRESOLVER
#    - traefik.http.services.$PMA_SERVICE_NAME.loadbalancer.server.port=8978
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: phppgadmin
        target: /var/lib/pgadmin
        volume:
          nocopy: true  
    networks:
      - dbapps
    ports: 
    - 8887:80
    restart: unless-stopped  

  mqtt-explorer:
    image: ghcr.io/thomasnordquist/mqtt-explorer:latest
    container_name: $MQTT_EXPLORER_SERVICE_NAME
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - MQTT_EXPLORER_USERNAME=$MQTT_EXPLORER_USERNAME
      - MQTT_EXPLORER_PASSWORD=$MQTT_EXPLORER_PASSWORD
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - type: volume
        source: mqtt-explorer
        target: /app/data
        volume:
          nocopy: true  
    networks:
      - internalapps
    ports: 
    - 3000:3000
    restart: unless-stopped  

networks:
  dbapps:
    name: dbapps
    ipam:
      driver: default
      config:
        - subnet: $DBLAPPS_SUBNET
          gateway: $DBAPPS_GW

